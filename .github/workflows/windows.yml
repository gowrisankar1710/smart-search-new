name: Windows build

on:
  workflow_dispatch: # "Run workflow" button on the Actions tab
  push:
    branches: [main]

# Publishing a release needs write access to the repository's contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - name: flutter build windows --release
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # Surface compiler errors as annotations (readable without signing in).
            $lines = Select-String -Path build.log -Pattern ': (fatal )?error |error C\d|error LNK|warning C\d' |
              ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 30
            for ($i = 0; $i -lt $lines.Count; $i += 3) {
              $chunk = ($lines[$i..([Math]::Min($i + 2, $lines.Count - 1))] -join ' || ')
              Write-Output "::error::$chunk"
            }
            exit 1
          }

      - uses: actions/upload-artifact@v5
        with:
          name: smart_file_search-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      # Also a GitHub Release: a public link that downloads without signing in.
      # The newest is always at …/releases/latest/download/smart_file_search-windows.zip
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath smart_file_search-windows.zip
          $sha = "${{ github.sha }}".Substring(0, 7)
          gh release create "windows-${{ github.run_number }}" smart_file_search-windows.zip `
            --target "${{ github.sha }}" `
            --title "Windows build ${{ github.run_number }} ($sha)" `
            --notes "Unzip and run smart_file_search.exe – keep the whole folder together. Built from commit $sha." `
            --latest
